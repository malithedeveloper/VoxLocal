name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-plugin:
    name: Linux x64 OBS plugin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake extra-cmake-modules ninja-build pkg-config \
            libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev \
            libavutil-dev libswresample-dev libswscale-dev libx264-dev \
            libcurl4-openssl-dev libmbedtls-dev libgl1-mesa-dev libjansson-dev \
            libx11-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xinerama0-dev \
            libxcb-composite0-dev libxcomposite-dev libxinerama-dev libxcb1-dev \
            libx11-xcb-dev libxcb-xfixes0-dev libxss-dev libglvnd-dev \
            libgles2-mesa-dev libdrm-dev librist-dev libsrt-openssl-dev libpci-dev \
            libqrcodegencpp-dev uuid-dev uthash-dev libsimde-dev \
            qt6-base-dev qt6-websockets-dev nlohmann-json3-dev
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVOXLOCAL_FETCH_OBS_SDK=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Stage plugin payload
        run: cmake --install build --prefix package/plugin --component Runtime
      - name: Smoke test plugin runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          plugin="package/plugin/voxlocal/bin/64bit/voxlocal.so"
          if find package/plugin/voxlocal/bin/64bit -maxdepth 1 -name 'libQt6*.so*' -print -quit | grep -q .; then
            echo "Linux packages must use the Qt runtime supplied by the OBS distribution." >&2
            find package/plugin/voxlocal/bin/64bit -maxdepth 1 -name 'libQt6*.so*' -print >&2
            exit 1
          fi
          obs_library="$(find build/_obs_sdk/install -name 'libobs.so*' -print -quit)"
          if [[ ! -f "${plugin}" || -z "${obs_library}" ]]; then
            echo "Could not locate the staged plugin or OBS runtime." >&2
            exit 1
          fi
          obs_library_dir="$(dirname "${obs_library}")"
          dependency_report="$(LD_LIBRARY_PATH="${obs_library_dir}:package/plugin/voxlocal/bin/64bit" ldd -r "${plugin}" 2>&1)"
          printf '%s\n' "${dependency_report}"
          if grep -Eq 'not found|undefined symbol' <<<"${dependency_report}"; then
            echo "The staged Linux plugin has unresolved runtime dependencies." >&2
            exit 1
          fi
      - name: Install Qt Installer Framework
        uses: jurplel/install-qt-action@v4
        with:
          tools: tools_ifw
          tools-only: true
          cache: true
      - name: Build Linux setup
        run: >-
          cmake
          -DVOXLOCAL_PLATFORM=linux
          -DVOXLOCAL_PAYLOAD_DIR=${{ github.workspace }}/package/plugin
          -DVOXLOCAL_OUTPUT=${{ github.workspace }}/release/VoxLocal-Setup-1.1.2-Linux-x86_64.run
          -DVOXLOCAL_WORK_DIR=${{ github.workspace }}/build/installer-linux
          -P cmake/package-installer.cmake
      - name: Mark setup executable
        run: chmod +x release/VoxLocal-Setup-1.1.2-Linux-x86_64.run
      - uses: actions/upload-artifact@v4
        with:
          name: VoxLocal-Setup-1.1.2-Linux-x86_64
          path: release/VoxLocal-Setup-1.1.2-Linux-x86_64.run
          if-no-files-found: error

  windows-plugin:
    name: Windows x64 OBS plugin
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          tools: tools_ifw
          tools-only: true
          cache: true
      - name: Configure
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DVOXLOCAL_FETCH_OBS_SDK=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}\build\_obs_sdk\obs-deps-qt6-2026-07-15-x64\bin;${{ github.workspace }}\build\_obs_sdk\qtwebsockets-install\bin;$env:PATH"
          ctest --test-dir build -C Release --output-on-failure
      - name: Stage plugin
        run: cmake --install build --prefix package/plugin --component Runtime --config Release
      - name: Smoke test HTTPS backend
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}\build\_obs_sdk\obs-deps-qt6-2026-07-15-x64\bin;$env:PATH"
          $pluginRuntime = (Resolve-Path 'package/plugin/voxlocal/bin/64bit').Path
          & 'build/Release/voxlocal-tls-smoke.exe' $pluginRuntime
          if ($LASTEXITCODE -ne 0) {
            throw "The packaged Windows TLS backend failed its runtime test."
          }
      - name: Smoke test plugin dependencies in OBS 32.2.1
        shell: pwsh
        run: |
          $obsArchive = Join-Path $env:RUNNER_TEMP 'obs-studio-32.2.1.zip'
          $obsRoot = Join-Path $env:RUNNER_TEMP 'obs-studio-32.2.1'
          Invoke-WebRequest `
            -Uri 'https://github.com/obsproject/obs-studio/releases/download/32.2.1/OBS-Studio-32.2.1-Windows-x64.zip' `
            -OutFile $obsArchive
          $actualHash = (Get-FileHash $obsArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne 'db64a2934f8261f85b1410b84be011207a0afda5400d008289f1f1e211bcc7de') {
            throw "OBS Studio archive checksum mismatch: $actualHash"
          }
          Expand-Archive -Path $obsArchive -DestinationPath $obsRoot
          $obsBin = (Get-ChildItem $obsRoot -Filter obs64.exe -Recurse | Select-Object -First 1).Directory.FullName
          $plugin = (Resolve-Path 'package/plugin/voxlocal/bin/64bit/voxlocal.dll').Path
          $pluginBin = Split-Path $plugin
          $source = @'
          using System;
          using System.ComponentModel;
          using System.Runtime.InteropServices;
          public static class NativeLibrarySmokeTest {
              [DllImport("kernel32", SetLastError = true)]
              static extern bool SetDefaultDllDirectories(uint flags);
              [DllImport("kernel32", CharSet = CharSet.Unicode, SetLastError = true)]
              static extern IntPtr AddDllDirectory(string path);
              [DllImport("kernel32", CharSet = CharSet.Unicode, SetLastError = true)]
              static extern IntPtr LoadLibraryEx(string path, IntPtr file, uint flags);
              [DllImport("kernel32", SetLastError = true)]
              static extern bool FreeLibrary(IntPtr module);
              public static void Load(string plugin, string obsBin, string pluginBin) {
                  const uint SEARCH_DEFAULT = 0x00001000;
                  const uint SEARCH_USER = 0x00000400;
                  if (!SetDefaultDllDirectories(SEARCH_DEFAULT | SEARCH_USER))
                      throw new Win32Exception(Marshal.GetLastWin32Error());
                  if (AddDllDirectory(obsBin) == IntPtr.Zero || AddDllDirectory(pluginBin) == IntPtr.Zero)
                      throw new Win32Exception(Marshal.GetLastWin32Error());
                  IntPtr handle = LoadLibraryEx(plugin, IntPtr.Zero, SEARCH_DEFAULT | SEARCH_USER);
                  if (handle == IntPtr.Zero)
                      throw new Win32Exception(Marshal.GetLastWin32Error(), "OBS could not load voxlocal.dll");
                  FreeLibrary(handle);
              }
          }
          '@
          Add-Type -TypeDefinition $source
          [NativeLibrarySmokeTest]::Load($plugin, $obsBin, $pluginBin)
          Write-Host 'OBS 32.2.1 successfully loaded voxlocal.dll and all runtime dependencies.'
      - name: Build Windows setup
        run: >-
          cmake
          -DVOXLOCAL_PLATFORM=windows
          -DVOXLOCAL_PAYLOAD_DIR=${{ github.workspace }}/package/plugin
          -DVOXLOCAL_OUTPUT=${{ github.workspace }}/release/VoxLocal-Setup-1.1.2-Windows-x64.exe
          -DVOXLOCAL_WORK_DIR=${{ github.workspace }}/build/installer-windows
          -P cmake/package-installer.cmake
      - uses: actions/upload-artifact@v4
        with:
          name: VoxLocal-Setup-1.1.2-Windows-x64
          path: release/VoxLocal-Setup-1.1.2-Windows-x64.exe
          if-no-files-found: error

  macos-plugin:
    name: macOS ${{ matrix.arch }} OBS plugin
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build -G Xcode
          -DVOXLOCAL_FETCH_OBS_SDK=ON
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.4
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage plugin
        run: cmake --install build --prefix package/plugin --component Runtime --config Release
      - name: Archive architecture payload
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            package/plugin/voxlocal.plugin \
            voxlocal-macOS-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: voxlocal-macOS-${{ matrix.arch }}-payload
          path: voxlocal-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error

  macos-installer:
    name: macOS universal setup
    needs: macos-plugin
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: voxlocal-macOS-arm64-payload
          path: payloads/arm64
      - uses: actions/download-artifact@v4
        with:
          name: voxlocal-macOS-x86_64-payload
          path: payloads/x86_64
      - name: Extract architecture payloads
        run: |
          mkdir -p extracted/arm64 extracted/x86_64 package/plugin
          ditto -x -k payloads/arm64/voxlocal-macOS-arm64.zip extracted/arm64
          ditto -x -k payloads/x86_64/voxlocal-macOS-x86_64.zip extracted/x86_64
          cp -R extracted/arm64/voxlocal.plugin package/plugin/voxlocal.plugin
      - name: Merge universal plugin binaries
        shell: bash
        run: |
          set -euo pipefail
          arm_root="extracted/arm64/voxlocal.plugin"
          intel_root="extracted/x86_64/voxlocal.plugin"
          universal_root="package/plugin/voxlocal.plugin"
          while IFS= read -r arm_file; do
            relative_path="${arm_file#${arm_root}/}"
            intel_file="${intel_root}/${relative_path}"
            universal_file="${universal_root}/${relative_path}"
            if file "${arm_file}" | grep -q 'Mach-O'; then
              if lipo "${arm_file}" -verify_arch arm64 x86_64; then
                continue
              fi
              if [[ ! -f "${intel_file}" ]]; then
                echo "Missing Intel counterpart for ${relative_path}" >&2
                exit 1
              fi
              lipo "${arm_file}" -verify_arch arm64
              lipo "${intel_file}" -verify_arch x86_64
              lipo -create "${arm_file}" "${intel_file}" -output "${universal_file}"
            fi
          done < <(find "${arm_root}" -type f)
          find "${universal_root}" -type f -exec file {} \;
          while IFS= read -r universal_file; do
            if file "${universal_file}" | grep -q 'Mach-O'; then
              lipo "${universal_file}" -verify_arch arm64 x86_64
            fi
          done < <(find "${universal_root}" -type f)
      - name: Sign and verify universal plugin
        run: |
          codesign --force --deep --sign - package/plugin/voxlocal.plugin
          codesign --verify --deep --strict --verbose=2 package/plugin/voxlocal.plugin
      - name: Install Qt Installer Framework
        uses: jurplel/install-qt-action@v4
        with:
          tools: tools_ifw
          tools-only: true
          cache: true
      - name: Build macOS setup
        run: >-
          cmake
          -DVOXLOCAL_PLATFORM=macos
          -DVOXLOCAL_PAYLOAD_DIR=${{ github.workspace }}/package/plugin
          -DVOXLOCAL_OUTPUT=${{ github.workspace }}/release/VoxLocal-Setup-1.1.2-macOS-universal.dmg
          -DVOXLOCAL_WORK_DIR=${{ github.workspace }}/build/installer-macos
          -P cmake/package-installer.cmake
      - uses: actions/upload-artifact@v4
        with:
          name: VoxLocal-Setup-1.1.2-macOS-universal
          path: release/VoxLocal-Setup-1.1.2-macOS-universal.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-plugin, windows-plugin, macos-installer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: VoxLocal-Setup-1.1.2-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          body_path: docs/RELEASE_NOTES_1.1.2.md
          files: dist/*
          fail_on_unmatched_files: true
