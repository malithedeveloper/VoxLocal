name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-plugin:
    name: Linux x64 OBS plugin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libobs-dev obs-studio qt6-base-dev qt6-websockets-dev nlohmann-json3-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: cpack --config build/CPackConfig.cmake
      - uses: actions/upload-artifact@v4
        with:
          name: voxlocal-0.1.0-Linux-x86_64
          path: voxlocal-*.zip
          if-no-files-found: error

  windows-plugin:
    name: Windows x64 OBS plugin
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: qtwebsockets
          cache: true
      - name: Configure
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DVOXLOCAL_FETCH_OBS_SDK=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage plugin
        run: cmake --install build --prefix package/VoxLocal --config Release
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path package/VoxLocal -DestinationPath voxlocal-0.1.0-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: voxlocal-0.1.0-Windows-x64
          path: voxlocal-0.1.0-Windows-x64.zip
          if-no-files-found: error

  macos-plugin:
    name: macOS ${{ matrix.arch }} OBS plugin
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: clang_64
          modules: qtwebsockets
          cache: true
      - name: Configure
        run: >-
          cmake -S . -B build -G Xcode
          -DVOXLOCAL_FETCH_OBS_SDK=ON
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage plugin
        run: cmake --install build --prefix package/VoxLocal --config Release
      - name: Sign and verify plugin bundle
        run: |
          codesign --force --deep --sign - package/VoxLocal/voxlocal.plugin
          codesign --verify --deep --strict --verbose=2 package/VoxLocal/voxlocal.plugin
      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent package/VoxLocal voxlocal-0.1.0-macOS-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: voxlocal-0.1.0-macOS-${{ matrix.arch }}
          path: voxlocal-0.1.0-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
